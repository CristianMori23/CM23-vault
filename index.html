<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM23 Gaming Vault</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #121318;
            --accent-orange: #ff3b00;
            --accent-orange-glow: rgba(255, 59, 0, 0.35);
            --text-main: #ffffff;
            --text-muted: #9a9ba4;
            --border-color: #22242d;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, rgba(18, 19, 24, 0.98), rgba(10, 10, 12, 0.95));
            border-bottom: 2px solid var(--accent-orange);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px var(--accent-orange-glow);
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon {
            width: 50px;
            height: 45px;
            filter: drop-shadow(0 0 6px var(--accent-orange-glow));
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .brand-title span {
            color: var(--accent-orange);
        }

        .btn-orange {
            background: var(--accent-orange);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px var(--accent-orange-glow);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-orange:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1.2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem 0.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-orange);
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card p {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
        }

        /* Controles de Búsqueda y Orden */
        .controls-container {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1 1 200px;
            padding: 0.7rem 0.9rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .sort-select {
            flex: 1 1 140px;
            padding: 0.7rem 0.8rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus, .sort-select:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px var(--accent-orange-glow);
        }

        /* Tabs mejoradas para móvil */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0.5rem 0.9rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab-btn.active, .tab-btn:hover {
            color: var(--accent-orange);
            background: rgba(255, 59, 0, 0.12);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.2rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px var(--accent-orange-glow);
            border-color: var(--accent-orange);
        }

        .game-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #1a1b22;
        }

        .game-info {
            padding: 0.9rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        .game-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-rating {
            background: rgba(255, 59, 0, 0.15);
            color: var(--accent-orange);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 59, 0, 0.3);
        }

        .game-notes {
            font-size: 0.8rem;
            color: #d1d2dc;
            background: rgba(0,0,0,0.4);
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.4rem;
            border-left: 3px solid var(--accent-orange);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8rem;
            gap: 0.5rem;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .btn-icon:hover {
            color: var(--accent-orange);
        }

        /* Estilos del Podio Top 5 */
        .podium-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0.5rem 0;
        }

        .podium-top3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            align-items: flex-end;
        }

        .podium-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .podium-1 {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            order: 2;
            transform: translateY(-12px);
        }

        .podium-2 {
            border-color: var(--silver);
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.2);
            order: 1;
        }

        .podium-3 {
            border-color: var(--bronze);
            box-shadow: 0 0 20px rgba(205, 127, 50, 0.2);
            order: 3;
        }

        .podium-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.8rem;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .badge-1 { background: var(--gold); color: #000; }
        .badge-2 { background: var(--silver); color: #000; }
        .badge-3 { background: var(--bronze); color: #fff; }
        .badge-rest { background: var(--border-color); color: var(--text-main); }

        .podium-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #1a1b22;
        }

        .podium-1 .podium-img { height: 190px; }

        .podium-info {
            padding: 0.8rem;
        }

        .podium-title {
            font-size: 0.95rem;
            font-weight: 900;
            margin-bottom: 0.3rem;
            color: var(--text-main);
        }

        .podium-rest-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .podium-rest-item {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .podium-rest-img {
            width: 90px;
            height: 85px;
            object-fit: cover;
        }

        .podium-rest-info {
            padding: 0.8rem;
            flex: 1;
        }

        /* Modal Base */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            padding: 1rem;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-orange);
            padding: 1.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 30px var(--accent-orange-glow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 1.2rem;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }

        /* Modal Detalle */
        .detail-modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-orange);
            border-radius: 8px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 0 35px var(--accent-orange-glow);
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .detail-header {
            position: relative;
            width: 100%;
            max-height: 350px;
            overflow: hidden;
            background: #000;
        }

        .detail-full-img {
            width: 100%;
            height: 100%;
            max-height: 350px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .detail-body {
            padding: 1.2rem;
        }

        .detail-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .detail-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }

        .badge {
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-orange {
            background: rgba(255, 59, 0, 0.2);
            color: var(--accent-orange);
            border: 1px solid var(--accent-orange);
        }

        .badge-dark {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .detail-notes-box {
            background: rgba(0, 0, 0, 0.5);
            border-left: 3px solid var(--accent-orange);
            padding: 1rem;
            border-radius: 4px;
            margin-top: 0.8rem;
            color: #e0e1e9;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .detail-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .close-btn-top {
            position: absolute;
            top: 12px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10;
        }

        .form-group {
            margin-bottom: 0.9rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.6rem;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .backup-section {
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.2rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .backup-section button {
            flex: 1;
        }

        /* Ajustes específicos para móviles */
        @media (max-width: 600px) {
            header {
                padding: 0.8rem 1rem;
            }

            .logo-icon {
                width: 40px;
                height: 35px;
            }

            .brand-title {
                font-size: 1.1rem;
                letter-spacing: 1px;
            }

            .btn-orange {
                padding: 0.5rem 0.8rem;
                font-size: 0.75rem;
            }

            main {
                padding: 0.9rem;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .game-img {
                height: 200px;
            }

            .podium-top3 { 
                grid-template-columns: 1fr; 
            }
            
            .podium-1 { 
                transform: none; 
                order: 1; 
            }
            .podium-2 { order: 2; }
            .podium-3 { order: 3; }

            .podium-rest-grid { 
                grid-template-columns: 1fr; 
            }

            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.4rem;
            }

            .stat-card {
                padding: 0.6rem 0.3rem;
            }

            .stat-card h3 {
                font-size: 0.6rem;
            }

            .stat-card p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="location.reload()">
            <svg class="logo-icon" viewBox="0 0 320 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 150 20 H 40 C 18 20 0 38 0 60 V 130 C 0 152 18 170 40 170 H 150 V 125 H 48 C 42 125 38 121 38 115 V 75 C 38 69 42 65 48 65 H 150 V 20 Z" fill="#ffffff"/>
                <path d="M 110 50 H 135 L 160 115 L 185 50 H 210 V 150 H 182 V 90 L 165 135 H 155 L 138 90 V 150 H 110 V 50 Z" fill="#ff3b00"/>
                <g fill="#ffffff">
                    <path d="M 150 220 C 150 198 168 180 190 180 H 220 C 220 180 220 198 220 202 L 180 235 H 220 V 260 H 150 V 242 L 195 205 H 185 C 178 205 175 208 175 215 H 150 Z"/>
                    <path d="M 228 180 H 290 V 205 H 255 V 212 H 280 C 290 212 298 220 298 230 V 248 C 298 258 290 266 280 266 H 228 V 241 H 272 V 232 H 248 V 212 H 228 V 180 Z"/>
                </g>
            </svg>
            <div class="brand-title">CM23 <span>VAULT</span></div>
        </div>
        <div>
            <button class="btn-orange" onclick="openModal()">+ Añadir</button>
        </div>
    </header>

    <main>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Completados</h3>
                <p id="statCompleted">0</p>
            </div>
            <div class="stat-card">
                <h3>Pendientes</h3>
                <p id="statBacklog">0</p>
            </div>
            <div class="stat-card">
                <h3>Nota Media</h3>
                <p id="statAvg">0.0</p>
            </div>
        </div>

        <!-- Controles de Búsqueda y Ordenamiento -->
        <div class="controls-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar juego..." oninput="render()">
            <select id="sortSelect" class="sort-select" onchange="render()">
                <option value="rating-desc">★ Mayor Nota</option>
                <option value="rating-asc">★ Menor Nota</option>
                <option value="title-asc">🔤 A - Z</option>
                <option value="title-desc">🔤 Z - A</option>
                <option value="year-desc">📅 Más recientes</option>
            </select>
        </div>

        <!-- Pestañas navegables con scroll suave en móvil -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('completed')">Completados</button>
            <button class="tab-btn" onclick="switchTab('backlog')">Pendientes</button>
            <button class="tab-btn" onclick="switchTab('top5')">🏆 Top 5</button>
        </div>

        <div id="tab-completed" class="tab-content active">
            <div id="completedContainer"></div>
        </div>

        <div id="tab-backlog" class="tab-content">
            <div id="backlogContainer" class="games-grid"></div>
        </div>

        <div id="tab-top5" class="tab-content">
            <div id="top5Container"></div>
        </div>

        <div class="backup-section">
            <button class="btn-outline" onclick="exportData()">Exportar JSON</button>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)">
            <button class="btn-outline" onclick="document.getElementById('importFile').click()">Importar JSON</button>
        </div>
    </main>

    <!-- Modal para Añadir / Editar -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Añadir Juego</h2>
            <form id="gameForm" onsubmit="saveGame(event)">
                <input type="hidden" id="gameId">
                <div class="form-group">
                    <label>Título del Juego</label>
                    <input type="text" id="title" required placeholder="Ej. Elden Ring">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="status">
                        <option value="Completado">Completado</option>
                        <option value="Pendiente">Pendiente (Backlog)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Año de Completado</label>
                    <input type="number" id="year" value="2026">
                </div>
                <div class="form-group">
                    <label>Plataforma</label>
                    <input type="text" id="platform" placeholder="Ej. PC, PS5, Switch">
                </div>
                <div class="form-group">
                    <label>Calificación (1 - 10)</label>
                    <input type="number" id="rating" min="1" max="10" step="0.5" value="8">
                </div>
                <div class="form-group">
                    <label>Ruta de la Imagen (Ej: img/juego.jpg)</label>
                    <input type="text" id="imagePath" placeholder="img/elden-ring.jpg">
                </div>
                <div class="form-group">
                    <label>Notas / Reseña personal</label>
                    <textarea id="notes" rows="4" placeholder="Trucos, impresiones..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-orange">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Vista Detallada del Juego -->
    <div id="detailModal" class="modal">
        <div class="detail-modal-content">
            <button class="close-btn-top" onclick="closeDetailModal()">✕</button>
            <div class="detail-header">
                <img id="detailImg" class="detail-full-img" src="" alt="Portada Completa">
            </div>
            <div class="detail-body">
                <h1 id="detailTitle" class="detail-title">Nombre del Juego</h1>
                <div class="detail-badges">
                    <span id="detailStatus" class="badge badge-orange">Completado</span>
                    <span id="detailYear" class="badge badge-dark">📅 2026</span>
                    <span id="detailPlatform" class="badge badge-dark">🎮 PC</span>
                    <span id="detailRating" class="badge badge-orange">★ 10/10</span>
                </div>

                <h3 style="color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Mis Notas & Reseña</h3>
                <div id="detailNotes" class="detail-notes-box">Sin notas registradas para este juego.</div>

                <div class="detail-actions">
                    <button id="btnEditFromDetail" class="btn-outline" onclick="">✏️ Editar</button>
                    <button class="btn-orange" onclick="closeDetailModal()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let games = JSON.parse(localStorage.getItem('cm23_vault_games')) || [];

        function saveToStorage() {
            try {
                localStorage.setItem('cm23_vault_games', JSON.stringify(games));
                render();
            } catch (e) {
                alert("⚠️ Error al guardar. La memoria del navegador está llena.");
            }
        }

        function openModal() {
            document.getElementById('gameModal').classList.add('open');
            document.getElementById('modalTitle').innerText = "Añadir Juego";
            document.getElementById('gameForm').reset();
            document.getElementById('gameId').value = '';
        }

        function closeModal() {
            document.getElementById('gameModal').classList.remove('open');
        }

        function openDetailModal(id) {
            const game = games.find(g => g.id === id);
            if(!game) return;

            document.getElementById('detailImg').src = game.image || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%231a1b22"><rect width="100" height="100"/><text x="50%" y="50%" fill="%239a9ba4" dominant-baseline="middle" text-anchor="middle" font-size="12">Sin Portada</text></svg>';
            document.getElementById('detailTitle').innerText = game.title;
            document.getElementById('detailStatus').innerText = game.status;
            document.getElementById('detailYear').innerText = `📅 Año ${game.year || 'N/A'}`;
            document.getElementById('detailPlatform').innerText = `🎮 ${game.platform || 'N/A'}`;
            document.getElementById('detailRating').innerText = `★ ${game.rating || '0'}/10`;
            document.getElementById('detailNotes').innerText = game.notes || 'No has añadido notas para este juego todavía.';

            document.getElementById('btnEditFromDetail').onclick = function() {
                closeDetailModal();
                editGame(game.id);
            };

            document.getElementById('detailModal').classList.add('open');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('open');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tabName === 'completed') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('tab-completed').classList.add('active');
            } else if(tabName === 'backlog') {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('tab-backlog').classList.add('active');
            } else if(tabName === 'top5') {
                document.querySelector('.tabs button:nth-child(3)').classList.add('active');
                document.getElementById('tab-top5').classList.add('active');
            }
        }

        function saveGame(event) {
            event.preventDefault();
            const id = document.getElementById('gameId').value || Date.now().toString();
            const title = document.getElementById('title').value;
            const status = document.getElementById('status').value;
            const year = document.getElementById('year').value;
            const platform = document.getElementById('platform').value;
            const rating = document.getElementById('rating').value;
            const notes = document.getElementById('notes').value;
            const imagePath = document.getElementById('imagePath').value;

            const existingIndex = games.findIndex(g => g.id === id);
            const gameData = {
                id, title, status, year, platform, rating, notes,
                image: imagePath || (existingIndex >= 0 ? games[existingIndex].image : '')
            };

            if (existingIndex >= 0) {
                games[existingIndex] = gameData;
            } else {
                games.push(gameData);
            }

            closeModal();
            saveToStorage();
        }

        function editGame(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;

            document.getElementById('gameId').value = game.id;
            document.getElementById('title').value = game.title;
            document.getElementById('status').value = game.status;
            document.getElementById('year').value = game.year || 2026;
            document.getElementById('platform').value = game.platform || '';
            document.getElementById('rating').value = game.rating || 8;
            document.getElementById('imagePath').value = game.image || '';
            document.getElementById('notes').value = game.notes || '';

            document.getElementById('modalTitle').innerText = "Editar Juego";
            document.getElementById('gameModal').classList.add('open');
        }

        function deleteGame(id, event) {
            if(event) event.stopPropagation();
            if(confirm('¿Seguro que quieres eliminar este juego?')) {
                games = games.filter(g => g.id !== id);
                saveToStorage();
            }
        }

        function render() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;
            
            let filteredGames = games.filter(g => {
                const titleMatch = g.title.toLowerCase().includes(searchTerm);
                const platformMatch = (g.platform || '').toLowerCase().includes(searchTerm);
                return titleMatch || platformMatch;
            });

            filteredGames.sort((a, b) => {
                if (sortBy === 'rating-desc') {
                    return parseFloat(b.rating || 0) - parseFloat(a.rating || 0);
                } else if (sortBy === 'rating-asc') {
                    return parseFloat(a.rating || 0) - parseFloat(b.rating || 0);
                } else if (sortBy === 'title-asc') {
                    return a.title.localeCompare(b.title);
                } else if (sortBy === 'title-desc') {
                    return b.title.localeCompare(a.title);
                } else if (sortBy === 'year-desc') {
                    return (b.year || 0) - (a.year || 0);
                }
                return 0;
            });

            const completedGames = filteredGames.filter(g => g.status === 'Completado');
            const backlogGames = filteredGames.filter(g => g.status === 'Pendiente');
            
            // Estadísticas globales
            const totalCompleted = games.filter(g => g.status === 'Completado').length;
            const totalBacklog = games.filter(g => g.status === 'Pendiente').length;
            
            document.getElementById('statCompleted').innerText = totalCompleted;
            document.getElementById('statBacklog').innerText = totalBacklog;

            const allCompleted = games.filter(g => g.status === 'Completado');
            if (allCompleted.length > 0) {
                const totalRating = allCompleted.reduce((acc, g) => acc + parseFloat(g.rating || 0), 0);
                document.getElementById('statAvg').innerText = (totalRating / allCompleted.length).toFixed(1);
            } else {
                document.getElementById('statAvg').innerText = '0.0';
            }

            const backlogContainer = document.getElementById('backlogContainer');
            backlogContainer.innerHTML = backlogGames.map(g => createCardHTML(g)).join('') || '<p style="color:var(--text-muted)">No se encontraron juegos pendientes.</p>';

            const completedContainer = document.getElementById('completedContainer');
            const years = [...new Set(completedGames.map(g => g.year || 'Sin año'))].sort((a,b) => b - a);

            if(years.length === 0) {
                completedContainer.innerHTML = '<p style="color:var(--text-muted)">No se encontraron juegos completados.</p>';
            } else {
                completedContainer.innerHTML = years.map(year => {
                    const yearGames = completedGames.filter(g => (g.year || 'Sin año') == year);
                    return `
                        <div style="margin-bottom: 2rem;">
                            <h3 style="color: var(--accent-orange); margin-bottom: 0.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 1px; font-size: 1.1rem;">📅 Año ${year}</h3>
                            <div class="games-grid">
                                ${yearGames.map(g => createCardHTML(g)).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Renderizar el Podio del Top 5
            renderTop5Podium();
        }

        function renderTop5Podium() {
            const top5Container = document.getElementById('top5Container');
            const completedSorted = games
                .filter(g => g.status === 'Completado')
                .sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0))
                .slice(0, 5);

            if (completedSorted.length === 0) {
                top5Container.innerHTML = '<p style="color:var(--text-muted); text-align: center; padding: 2rem;">Añade juegos completados para generar tu Top 5.</p>';
                return;
            }

            let top3HTML = '';
            let restHTML = '';

            completedSorted.forEach((g, index) => {
                const pos = index + 1;
                const img = g.image || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%231a1b22"><rect width="100" height="100"/><text x="50%" y="50%" fill="%239a9ba4" dominant-baseline="middle" text-anchor="middle" font-size="12">Sin Portada</text></svg>';
                
                if (pos <= 3) {
                    top3HTML += `
                        <div class="podium-item podium-${pos}" onclick="openDetailModal('${g.id}')">
                            <span class="podium-badge badge-${pos}">${pos}º</span>
                            <img src="${img}" class="podium-img" alt="${g.title}">
                            <div class="podium-info">
                                <div class="podium-title">${g.title}</div>
                                <div class="game-meta" style="justify-content: center; gap: 0.8rem; margin-bottom: 0;">
                                    <span>${g.platform || 'N/A'}</span>
                                    <span class="game-rating">★ ${g.rating}/10</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    restHTML += `
                        <div class="podium-rest-item" onclick="openDetailModal('${g.id}')">
                            <span class="podium-badge badge-rest" style="top: 6px; left: 6px; font-size: 0.7rem; padding: 0.2rem 0.4rem;">${pos}º</span>
                            <img src="${img}" class="podium-rest-img" alt="${g.title}">
                            <div class="podium-rest-info">
                                <div class="podium-title">${g.title}</div>
                                <div class="game-meta" style="margin-bottom: 0;">
                                    <span>${g.platform || 'N/A'}</span>
                                    <span class="game-rating">★ ${g.rating}/10</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            top5Container.innerHTML = `
                <div class="podium-container">
                    <h2 style="color: var(--accent-orange); text-align: center; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.8rem; font-size: 1.2rem;">👑 Salón de la Fama - Top 5</h2>
                    <div class="podium-top3">
                        ${top3HTML}
                    </div>
                    ${restHTML ? `<div class="podium-rest-grid">${restHTML}</div>` : ''}
                </div>
            `;
        }

        function createCardHTML(g) {
            return `
                <div class="game-card" onclick="openDetailModal('${g.id}')">
                    <img src="${g.image || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%231a1b22"><rect width="100" height="100"/><text x="50%" y="50%" fill="%239a9ba4" dominant-baseline="middle" text-anchor="middle" font-size="12">Sin Portada</text></svg>'}" class="game-img" alt="${g.title}">
                    <div class="game-info">
                        <div>
                            <div class="game-title">${g.title}</div>
                            <div class="game-meta">
                                <span>${g.platform || 'N/A'}</span>
                                <span class="game-rating">★ ${g.rating}/10</span>
                            </div>
                            ${g.notes ? `<div class="game-notes">${g.notes}</div>` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="btn-icon" onclick="event.stopPropagation(); editGame('${g.id}')" title="Editar">✏️</button>
                            <button class="btn-icon" onclick="deleteGame('${g.id}', event)" title="Eliminar">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(games));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "cm23_vault_backup.json");
            dlAnchorElem.click();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = event => {
                    try {
                        games = JSON.parse(event.target.result);
                        saveToStorage();
                        alert("¡Datos importados con éxito!");
                    } catch (e) {
                        alert("El archivo no es válido.");
                    }
                };
            }
        }

        render();
    </script>
</body>
</html>
